name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  lint-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Flake8
        run: pip install flake8

      - name: Executar lint
        run: flake8 . --exclude=venv,migrations --ignore=E501


  build-backend:
    runs-on: ubuntu-latest

    needs: lint-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem do backend
        run: docker build -t semana5-backend ./backend


  test-backend:
    runs-on: ubuntu-latest

    needs: build-backend

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar testes Django
        run: python manage.py test


  lint-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar ESLint
        run: npm run lint


  build-frontend:
    runs-on: ubuntu-latest

    needs: lint-frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build do frontend
        run: npm run build


  test-frontend:
    runs-on: ubuntu-latest

    needs: build-frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test